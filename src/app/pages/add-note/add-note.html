<div class="container-cards">

  <div class="note-card-add" (click)="openModalAddNote()">
    <div class="icon-circle">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
    </div>
    <h3>Add Note</h3>
    <p>Write down your thoughts, ideas, reminders, and personal notes to keep
      track of what matters to you.</p>
  </div>

  @for (n of myNotes; track $index) {
  <div class="note-card">
    <div class="icon-circle">
      <svg viewBox="0 0 24 24">
        <path d="M6 3h12v18H6zM9 7h6M9 11h6M9 15h4" />
      </svg>
    </div>
    <h3>{{n.title}}</h3>
    <p>{{n.content}}</p>
    <span class="createdAtNote">{{n.createdAt | date : 'dd/MM/yyyy HH:mm:ss'}}</span>
    <button class="icon-btn btn-delete-note danger" (click)="deleteNote($index)"><svg viewBox="0 0 24 24"><path
                  d="M3 6h18" /><path
                  d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /><path
                  d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" /></svg></button>
  </div>
  }

  <app-add-note-modal
    [isOpen]="isModalAddNoteOpen"
    (close)="closeModalAddNote()" 
    (newNoteValues)="receiveNewNoteAndSave($event)"
  />

</div>
