@if(isOpen){
  
  <div class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2>My profile</h2>
        <button class="close-btn" (click)="closeModal()">×</button>
      </div>

      <div class="identity">
        <div class="avatar-lg">
          J
          <span class="status-dot"></span>
        </div>
        <h3>Sara Amrani</h3>
        <p class="email">sara@fieldnote.io</p>       
      </div>

      <div class="info-list">
        <div class="info-row">
          <div class="icon-box"><svg viewBox="0 0 24 24"><path d="M3 6.5l9 6.5 9-6.5"/><rect x="3" y="5" width="18" height="14" rx="2"/></svg></div>
          <div class="text">
            <span class="label">Email</span>
            <span class="value">sara@fieldnote.io</span>
          </div>
        </div>

        <div class="info-row">
          <div class="icon-box"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg></div>
          <div class="text">
            <span class="label">member since</span>
            <span class="value">january 2024</span>
          </div>
        </div>

        <div class="info-row">
          <div class="icon-box"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></div>
          <div class="text">
            <span class="label">last connection</span>
            <span class="value">Aujourd'hui à 09:42</span>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button class="edit-btn">
          <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
          Modifier
        </button>
        <button class="logout-btn">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          Déconnexion
        </button>
      </div>
    </div>
  </div>


}
