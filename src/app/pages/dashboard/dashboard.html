

<div class="wrap">
  <div class="panel-head">
    <div>
      <h1>My notes</h1>
      <p>All your saved notes</p>
    </div>
    <button class="new-btn">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
      add a new note
    </button>
  </div>

  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th class="col-id"></th>
          <th class="col-id">ID</th>
          <th>Title</th>
          <th class="col-content">Content</th>
          <th class="col-date">Created At</th>
          <th class="col-actions">Actions</th>
        </tr>
      </thead>
      <tbody>
        @for(note of userNotes; track $index){
        <tr>
          <td class="col-id">{{$index}}</td>
          <td class="col-id">{{note.id}}</td>
          <td class="col-title">{{note.title}}</td>
          <td class="col-content">{{note.content}}</td>
          <td class="col-date">{{note.createdAt}}<span class="rel">Il y a .....
              semaines</span></td>
          <td class="col-actions">
            <button class="icon-btn danger"><svg viewBox="0 0 24 24"><path
                  d="M3 6h18" /><path
                  d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /><path
                  d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" /></svg></button>
          </td>
        </tr>
        }
      </tbody>
    </table>
  </div>
</div>
