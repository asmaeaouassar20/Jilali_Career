@if(isOpen){
<div class="modal-overlay">
    <form class="modal" [formGroup]="form" (ngSubmit)="addNewNote()">
        <div class="modal-header">
            <h2>Add a Note</h2>
            <button class="close-btn" (click)="closeModal()">x</button>
        </div>

        <div class="modal-body"> 
            <p>Write your thoyghts here</p>
            <input class="input-title" placeholder="add title"
                formControlName="title" />
                @if(form.controls.title.hasError('required')){
                    <small class="field-error">Title is required</small>
                }
            <textarea  style="margin-top: 10px;" placeholder="Write your note..."
                formControlName="content"></textarea>
                @if(form.controls.content.hasError('required')){
                    <small class="field-error">Content is required</small>
                }
        </div>
        <div class="modal-footer">
            <button class="cancel-btn" (click)="closeModal()">Cancel</button>
            <button class="save-btn" type="submit">Save</button>
        </div>
    </form>
</div>
}
